name: Workshop backend

on:
  push:
    paths: ['workshop-backend/**', '.github/workflows/workshop-backend.yml']
  pull_request:
    paths: ['workshop-backend/**', '.github/workflows/workshop-backend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: workshop
          POSTGRES_USER: workshop
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U workshop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: workshop-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workshop-backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Select PostgreSQL
        if: matrix.database == 'postgres'
        run: |
          echo "POSTGRES_DB=workshop" >> "$GITHUB_ENV"
          echo "POSTGRES_USER=workshop" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=ci-only-password" >> "$GITHUB_ENV"
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --verbosity 2
